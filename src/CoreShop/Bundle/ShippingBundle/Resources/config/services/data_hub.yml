services:
    coreshop.datahub.graphql.querytypegenerator.resource.carrier:
        class: CoreShop\Component\Resource\DataHub\QueryType\Resource
        arguments:
            - '@OpenDxp\Bundle\DataHubBundle\GraphQL\Service'
            - '@coreshop.data_hub.doctrine_provider'
            - '%coreshop.model.carrier.class%'
        tags:
            - { name: opendxp.datahub.graphql.dataobjectquerytypegenerator, id: typegenerator_dataobjectquerydatatype_coreShopCarrier }

    coreshop.datahub.graphql.querytypegenerator.resource.carrier.list:
        class: CoreShop\Component\Resource\DataHub\QueryType\ResourceList
        arguments:
            - '@OpenDxp\Bundle\DataHubBundle\GraphQL\Service'
            - '@coreshop.data_hub.doctrine_provider'
            - '%coreshop.model.carrier.class%'
        tags:
            - { name: opendxp.datahub.graphql.dataobjectquerytypegenerator, id: typegenerator_dataobjectquerydatatype_coreShopCarrierMultiselect }
