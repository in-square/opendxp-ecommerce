services:
  _defaults:
    public: true

  CoreShop\Bundle\TestBundle\Context\Domain\ClassContext:
    arguments:
      - '@CoreShop\Bundle\TestBundle\Service\ClassStorage'
    tags:
      - { name: fob.context_service }

  CoreShop\Bundle\TestBundle\Context\Domain\OpenDxpContext:
    arguments:
      - '%kernel.project_dir%/public'
      - '%coreshop.all.opendxp.admin.js%'
      - '%coreshop.all.opendxp.admin.css%'
      - '%coreshop.all.opendxp.admin.editmode_js%'
      - '%coreshop.all.opendxp.admin.editmode_css%'
    tags:
      - { name: fob.context_service }

  CoreShop\Bundle\TestBundle\Context\Domain\SiteContext:
    tags:
      - { name: fob.context_service }

  CoreShop\Bundle\TestBundle\Context\Domain\DocumentContext:
    tags:
      - { name: fob.context_service }
