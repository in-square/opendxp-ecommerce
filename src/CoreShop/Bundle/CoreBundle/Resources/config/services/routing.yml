services:
    _defaults:
        public: true

    coreshop.object.link_generator.product:
        class: CoreShop\Bundle\CoreBundle\OpenDxp\LinkGenerator\DataObjectLinkGenerator
        arguments:
            - 'product'
            - 'coreshop_product_detail'
            - '@router'
            - '@CoreShop\Component\Resource\Metadata\RegistryInterface'
            - '@CoreShop\Component\OpenDxp\Slug\SluggableLinkGenerator'

    coreshop.object.link_generator.category:
        class: CoreShop\Bundle\CoreBundle\OpenDxp\LinkGenerator\DataObjectLinkGenerator
        arguments:
            - 'category'
            - 'coreshop_category_list'
            - '@router'
            - '@CoreShop\Component\Resource\Metadata\RegistryInterface'
            - '@CoreShop\Component\OpenDxp\Slug\SluggableLinkGenerator'

    CoreShop\Bundle\CoreBundle\OpenDxp\LinkGenerator\ResourceConfigurationLinkGenerator:
        arguments:
            - '@router'
            - '@CoreShop\Component\Resource\Metadata\RegistryInterface'
        tags:
            - { name: coreshop.link_generator, type: resource-configuration, priority: 10 }