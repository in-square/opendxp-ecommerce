services:
    _defaults:
        public: true

    coreshop.theme.resolver.registry:
        class: CoreShop\Component\Registry\PrioritizedServiceRegistry
        arguments:
            - 'CoreShop\Bundle\ThemeBundle\Service\ThemeResolverInterface'
            - 'Theme Resolver'
        tags:
            - { name: coreshop.registry, type_hint: themeResolvers }

    CoreShop\Bundle\ThemeBundle\Service\ThemeResolverInterface: '@CoreShop\Bundle\ThemeBundle\Service\CompositeThemeResolver'
    CoreShop\Bundle\ThemeBundle\Service\DocumentThemeResolverInterface: '@CoreShop\Bundle\ThemeBundle\Service\CompositeThemeResolver'
    CoreShop\Bundle\ThemeBundle\Service\CompositeThemeResolver:
        tags:
            - '@coreshop.theme.resolver.registry'

    CoreShop\Bundle\ThemeBundle\Service\OpenDxpSiteThemeResolver:
        arguments:
            - '@Symfony\Component\HttpFoundation\RequestStack'
            - '@OpenDxp\Http\Request\Resolver\DocumentResolver'
        tags:
            - { name: coreshop.theme.resolver, type: opendxp_site, priority: 10 }

    CoreShop\Bundle\ThemeBundle\Service\OpenDxpDocumentPropertyResolver:
        arguments:
            - '@Symfony\Component\HttpFoundation\RequestStack'
            - '@OpenDxp\Http\Request\Resolver\DocumentResolver'
            - '@OpenDxp\Model\Document\Service'
            - '@OpenDxp\Http\Request\Resolver\SiteResolver'
        tags:
            - { name: coreshop.theme.resolver, type: opendxp_document_property, priority: 15 }

    CoreShop\Bundle\ThemeBundle\Service\ThemeHelperInterface: '@CoreShop\Bundle\ThemeBundle\Service\ThemeHelper'
    CoreShop\Bundle\ThemeBundle\Service\ThemeHelper:
        arguments:
            - '@Sylius\Bundle\ThemeBundle\Repository\ThemeRepositoryInterface'
            - '@Sylius\Bundle\ThemeBundle\Context\SettableThemeContext'

    CoreShop\Bundle\ThemeBundle\Context\ThemeContext:
        arguments:
            - '@CoreShop\Bundle\ThemeBundle\Service\ThemeResolverInterface'
            - '@Sylius\Bundle\ThemeBundle\Repository\ThemeRepositoryInterface'
            - '@OpenDxp\Http\Request\Resolver\OpenDxpContextResolver'
            - '@Symfony\Component\HttpFoundation\RequestStack'
            - '@Sylius\Bundle\ThemeBundle\Context\SettableThemeContext'

    CoreShop\Bundle\ThemeBundle\EventListener\DocumentRenderListener:
        arguments:
            - '@Sylius\Bundle\ThemeBundle\Repository\ThemeRepositoryInterface'
            - '@Sylius\Bundle\ThemeBundle\Context\SettableThemeContext'
            - '@CoreShop\Bundle\ThemeBundle\Service\DocumentThemeResolverInterface'
        tags:
            - { name: kernel.event_subscriber }