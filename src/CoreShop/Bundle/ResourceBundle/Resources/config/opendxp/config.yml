imports:
    - { resource: admin.yml }

jms_serializer:
    metadata:
        directories:
            coreshop-resource:
                namespace_prefix: "OpenDxp"
                path: "@CoreShopResourceBundle/Resources/config/serializer"
            coreshop-carbon:
                namespace_prefix: "Carbon"
                path: "@CoreShopResourceBundle/Resources/config/serializer"
    property_naming:
        id: 'jms_serializer.identical_property_naming_strategy'

core_shop_resource:
    mapping:
        paths:
            - '%kernel.project_dir%/src/Model'

opendxp:
    objects:
        class_definitions:
            data:
                map:
                    coreShopRelation: CoreShop\Bundle\ResourceBundle\CoreExtension\CoreShopRelation
                    coreShopRelations: CoreShop\Bundle\ResourceBundle\CoreExtension\CoreShopRelations

doctrine:
    dbal:
        types:
            opendxpObject:
                class: CoreShop\Component\Resource\Doctrine\Type\OpenDxpObject
            opendxpDocument:
                class: CoreShop\Component\Resource\Doctrine\Type\OpenDxpDocument
            opendxpAsset:
                class: CoreShop\Component\Resource\Doctrine\Type\OpenDxpAsset
            opendxpSite:
                class: CoreShop\Component\Resource\Doctrine\Type\OpenDxpSite
            pimcoreObject:
                class: CoreShop\Component\Resource\Doctrine\Type\OpenDxpObject
            pimcoreDocument:
                class: CoreShop\Component\Resource\Doctrine\Type\OpenDxpDocument
            pimcoreAsset:
                class: CoreShop\Component\Resource\Doctrine\Type\OpenDxpAsset
            pimcoreSite:
                class: CoreShop\Component\Resource\Doctrine\Type\OpenDxpSite
            bigintInteger:
                class: CoreShop\Component\Resource\Doctrine\Type\BigIntIntegerType
        mapping_types:
            enum: string
    orm:
        auto_generate_proxy_classes: '%kernel.debug%'
        default_entity_manager: default
        entity_managers:
            default:
                auto_mapping: true

framework:
    form: true

stof_doctrine_extensions:
    default_locale: '%locale%'
    orm:
        default:
            timestampable: true
