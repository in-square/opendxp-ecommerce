imports:
    - { resource: services/routing.yml }
    - { resource: services/controller.yml }
    - { resource: services/installer.yml }
    - { resource: services/commands.yml }
    - { resource: services/validators.yml }
    - { resource: services/form.yml }
    - { resource: services/grid.yml }

services:
    _defaults:
        public: true

    coreshop.form.factory: '@form.factory'

    CoreShop\Component\Resource\Metadata\RegistryInterface: '@CoreShop\Component\Resource\Metadata\Registry'
    CoreShop\Component\Resource\Metadata\Registry: ~

    CoreShop\Bundle\ResourceBundle\OpenDxp\ObjectManager: ~

    CoreShop\Bundle\ResourceBundle\Doctrine\ORM\EntityMerger:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '%coreshop.orm_cascade_merge%'

    CoreShop\Bundle\ResourceBundle\Serialization\RelationsHandler:
        arguments:
            - '@doctrine.orm.entity_manager'
        tags:
            - { name: jms_serializer.handler, type: relation, direction: serialization, format: json, method: serializeRelation }
            - { name: jms_serializer.handler, type: relation, direction: deserialization, format: json, method: deserializeRelation }
            - { name: jms_serializer.handler, type: relation<?>, direction: serialization, format: json, method: serializeRelation }
            - { name: jms_serializer.handler, type: relation<?>, direction: deserialization, format: json, method: deserializeRelation }

    CoreShop\Bundle\ResourceBundle\Serialization\OpenDxpObjectHandler:
        tags:
            - { name: jms_serializer.handler, type: opendxpObject, direction: serialization, format: json, method: serializeRelation }
            - { name: jms_serializer.handler, type: opendxpObject, direction: deserialization, format: json, method: deserializeRelation }
            - { name: jms_serializer.handler, type: opendxpObject<?>, direction: serialization, format: json, method: serializeRelation }
            - { name: jms_serializer.handler, type: opendxpObject<?>, direction: deserialization, format: json, method: deserializeRelation }

    CoreShop\Bundle\ResourceBundle\Serialization\OpenDxpDocumentHandler:
        tags:
            - { name: jms_serializer.handler, type: opendxpDocument, direction: serialization, format: json, method: serializeRelation }
            - { name: jms_serializer.handler, type: opendxpDocument, direction: deserialization, format: json, method: deserializeRelation }
            - { name: jms_serializer.handler, type: opendxpDocument<?>, direction: serialization, format: json, method: serializeRelation }
            - { name: jms_serializer.handler, type: opendxpDocument<?>, direction: deserialization, format: json, method: deserializeRelation }

    CoreShop\Bundle\ResourceBundle\Serialization\OpenDxpAssetHandler:
        tags:
            - { name: jms_serializer.handler, type: opendxpAsset, direction: serialization, format: json, method: serializeRelation }
            - { name: jms_serializer.handler, type: opendxpAsset, direction: deserialization, format: json, method: deserializeRelation }
            - { name: jms_serializer.handler, type: opendxpAsset<?>, direction: serialization, format: json, method: serializeRelation }
            - { name: jms_serializer.handler, type: opendxpAsset<?>, direction: deserialization, format: json, method: deserializeRelation }

    CoreShop\Bundle\ResourceBundle\Serialization\OpenDxpSiteHandler:
        tags:
            - { name: jms_serializer.handler, type: opendxpSite, direction: serialization, format: json, method: serializeRelation }
            - { name: jms_serializer.handler, type: opendxpSite, direction: deserialization, format: json, method: deserializeRelation }

    CoreShop\Bundle\ResourceBundle\Serialization\CarbonHandler:
        tags:
            - { name: jms_serializer.handler, type: carbon, direction: serialization, format: json, method: serializeRelation }

    CoreShop\Bundle\ResourceBundle\Controller\AdminController:
        abstract: true
        calls:
            - [ 'setTokenResolver', [ '@OpenDxp\Security\User\TokenStorageUserResolver' ] ]
        arguments:
            - '@service_container'
            - '@CoreShop\Bundle\ResourceBundle\Controller\ViewHandlerInterface'
            - '@Symfony\Component\DependencyInjection\ParameterBag\ParameterBagInterface'

    CoreShop\Bundle\ResourceBundle\Controller\ResourceSettingsController:
        parent: CoreShop\Bundle\ResourceBundle\Controller\AdminController
        calls:
            - [ 'setOpenDxpSerializer', [ '@opendxp.serializer' ] ]
        tags:
            - { name: container.service_subscriber }

    CoreShop\Bundle\ResourceBundle\Form\Helper\ErrorSerializer:
        arguments:
            - '@translator'

    CoreShop\Bundle\ResourceBundle\Serialization\Driver\OpenDxpDataObjectDriver:
        decorates: 'jms_serializer.metadata_driver'
        arguments:
            - '@CoreShop\Bundle\ResourceBundle\Serialization\Driver\OpenDxpDataObjectDriver.inner'

    CoreShop\Bundle\ResourceBundle\EventListener\DeepCopySubscriber:
        tags:
            - { name: kernel.event_subscriber }

    coreshop.jms_serializer.object_constructor:
        class: JMS\Serializer\Construction\UnserializeObjectConstructor

    CoreShop\Bundle\ResourceBundle\Serialization\VersionObjectConstructor:
        decorates: 'jms_serializer.object_constructor'
        arguments:
            - '@CoreShop\Bundle\ResourceBundle\Serialization\VersionObjectConstructor.inner'
            - '@coreshop.jms_serializer.object_constructor'

    CoreShop\Component\Resource\Service\FolderCreationServiceInterface: '@CoreShop\Component\Resource\Service\FolderCreationService'
    CoreShop\Component\Resource\Service\FolderCreationService:
        arguments:
            - '@CoreShop\Component\Resource\Metadata\RegistryInterface'
            - '@CoreShop\Component\OpenDxp\DataObject\ObjectServiceInterface'

    CoreShop\Bundle\ResourceBundle\Slug\ResourceConfigurationSlugGenerator:
        decorates: 'CoreShop\Component\OpenDxp\Slug\DataObjectSlugGeneratorInterface'
        arguments:
            - '@CoreShop\Bundle\ResourceBundle\Slug\ResourceConfigurationSlugGenerator.inner'
            - '@CoreShop\Component\Resource\Metadata\RegistryInterface'

    CoreShop\Component\Resource\OpenDxp\ResourceSlugLinkGenerator:
        decorates: 'CoreShop\Component\OpenDxp\Slug\SluggableLinkGenerator'
        arguments:
            - '@CoreShop\Component\Resource\OpenDxp\ResourceSlugLinkGenerator.inner'
            - '@CoreShop\Component\Resource\Metadata\RegistryInterface'

    CoreShop\Bundle\ResourceBundle\Cache\CoreCacheHandlerDecorator:
        decorates: 'OpenDxp\Cache\Core\CoreCacheHandler'
        arguments:
            - '@opendxp.cache.pool'
            - '@OpenDxp\Cache\Core\WriteLock'
            - '@event_dispatcher'
        calls:
            - [ setLogger, [ '@logger' ] ]
