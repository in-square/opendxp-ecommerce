imports:
    - { resource: ../test/config.yaml }
    - { resource: '@OpenDxpCoreBundle/config/opendxp/prod.yaml' } # loads default prod configuration
    - { resource: '@OpenDxpCoreBundle/config/opendxp/dev.yaml' } # loads default dev configuration
    - { resource: '@OpenDxpCoreBundle/config/opendxp/test.yaml' } # loads default test configuration

core_shop_currency:
    money_decimal_precision: 6
    money_decimal_factor: 1000000

services:
    CoreShop\Behat\Service\ConfigurationBasedDisplayFractionProvider:
        decorates: 'CoreShop\Component\Currency\Display\DefaultDisplayFractionProvider'
        arguments:
            - '%coreshop.currency.decimal_precision%'
