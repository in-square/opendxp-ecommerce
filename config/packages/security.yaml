parameters:
    coreshop.security.frontend_regex: "^/(?!admin)[^/]*"

opendxp:
    security:
        password_hasher_factories:
            OpenDxp\Model\DataObject\CoreShopUser: coreshop.security.user.password_hasher_factories

security:
    providers:
        opendxp_admin:
            id: OpenDxp\Security\User\UserProvider
        coreshop_user:
            id: CoreShop\Bundle\CoreBundle\Security\ObjectUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # OpenDxp WebDAV HTTP basic // DO NOT CHANGE!
        opendxp_webdav:
            pattern: ^/asset/webdav
            provider: opendxp_admin
            http_basic: ~

        # OpenDxp Admin Bundle firewall
        opendxp_admin: '%opendxp_admin_bundle.firewall_settings%'

        coreshop_frontend:
            provider: coreshop_user
            pattern: '%coreshop.security.frontend_regex%'
            context: shop
            form_login:
                login_path: coreshop_login
                check_path: coreshop_login_check
                provider: coreshop_user
                failure_path: coreshop_login
                default_target_path: coreshop_index
                use_forward: false
                use_referer: true
            remember_me:
                secret: "%secret%"
                name: APP_CORESHOP_REMEMBER_ME
                lifetime: 31536000
                remember_me_parameter: _remember_me
            logout:
                path: coreshop_logout
                target: coreshop_login
                invalidate_session: false

    access_control:
        # OpenDxp admin ACl  // DO NOT CHANGE!
        - { path: ^/admin/settings/display-custom-logo, roles: PUBLIC_ACCESS }
        - { path: ^/admin/login/2fa-verify, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin/login/2fa-setup, roles: ROLE_OPENDXP_USER }
        - { path: ^/admin/login/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/login/(login|lostpassword|deeplink|csrf-token)$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_OPENDXP_USER }
        - { path: ^/asset/webdav, roles: ROLE_OPENDXP_USER }
        - { path: "%coreshop.security.frontend_regex%/_partial", roles: PUBLIC_ACCESS, ips: [127.0.0.1, ::1] }
        - { path: "%coreshop.security.frontend_regex%/_partial", roles: ROLE_NO_ACCESS }

    role_hierarchy:
        # OpenDxp admin  // DO NOT CHANGE!
        ROLE_OPENDXP_ADMIN: [ROLE_OPENDXP_USER]