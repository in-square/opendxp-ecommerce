name: Static Tests (Lint, Stan)
on:
  push:
    paths:
      - 'features/**'
      - 'behat.yml.dist'
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '*.php'
      - '*.neon'
      - '*.xml'
      - 'composer.json'
  pull_request:
    paths:
      - 'features/**'
      - 'behat.yml.dist'
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '*.php'
      - '*.neon'
      - '*.xml'
      - 'composer.json'
  release:
    types: [ created ]
  schedule:
    - cron: "0 1 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      APP_ENV: "test"
      OPENDXP_TEST_DB_DSN: "mysql://root:root@127.0.0.1:3306/coreshop_test"
      CORESHOP_MIGRATION_TEST_DSN: "mysql://root:root@127.0.0.1:3306/coreshop_migration_test"
      OPENDXP_INSTALL_MYSQL_HOST_SOCKET: "127.0.0.1"
      OPENDXP_INSTALL_MYSQL_PORT: "3306"
      OPENDXP_INSTALL_MYSQL_DATABASE: "coreshop_test"
      OPENDXP_INSTALL_MYSQL_USERNAME: "root"
      OPENDXP_INSTALL_MYSQL_PASSWORD: "root"
      OPENDXP_INSTALL_ADMIN_USERNAME: "admin"
      OPENDXP_INSTALL_ADMIN_PASSWORD: "admin"
      OPENDXP_KERNEL_CLASS: "Kernel"

    strategy:
      matrix:
        php: [ 8.3 ]
        opendxp: [ '~1.3.0', '^1.3' ]
        jms: [ ^4.0, ^5.0 ]
        dependencies: [ highest ]
    services:
      database:
        image: "mysql:8"
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: coreshop_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    name: "${{ matrix.opendxp }}, PHP ${{ matrix.php }}, Deps ${{ matrix.dependencies }}, JMS ${{ matrix.jms }}"

    steps:
    - uses: actions/checkout@v4

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        ini-values: display_errors=On, display_startup_errors=On, error_reporting=32767
        extensions: intl, gd, simpleXML, dom, exif, fileinfo, iconv, mbstring, mysqli, pdo_mysql, pdo_sqlite, zip, zlib

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: jms/serializer-bundle
      run: composer require "jms/serializer-bundle:${{ matrix.jms }}" --no-update --no-scripts

    - name: open-dxp/opendxp
      run: composer req open-dxp/opendxp:${{ matrix.opendxp }} --no-interaction --no-scripts --no-update

    - if: matrix.dependencies == 'highest'
      name: Install dependencies highest
      run: composer update --no-progress --prefer-dist --optimize-autoloader

    - if: matrix.dependencies == 'lowest'
      name: Install dependencies lowest
      run: composer update --no-progress --prefer-dist --optimize-autoloader --prefer-lowest

    - name: Install OpenDXP and CoreShop
      run: |
        php vendor/bin/opendxp-install --env=test --no-interaction --skip-database-config
        php bin/console coreshop:install --env=test --no-interaction

    - name: Unit and Doctrine integration tests
      run: |
        mysql --host 127.0.0.1 --port ${{ job.services.database.ports['3306'] }} -uroot -proot -e "CREATE DATABASE coreshop_migration_test CHARSET=utf8mb4;"
        vendor/bin/phpunit --bootstrap vendor/autoload.php --do-not-cache-result tests/Unit tests/Integration/Doctrine

    - name: Validate YAML
      run: bin/console lint:yaml src

    - name: Validate TWIG
      run: bin/console lint:twig src

    - name: Validate Container
      run: bin/console lint:container

    - name: Validate Doctrine Settings
      run: bin/console doctrine:schema:validate --skip-sync

    - name: STAN
      run: |
        cp -f config/packages/stan/config.yaml config/packages/dev/config.yaml
        bin/console cache:clear --env=dev
        vendor/bin/phpstan analyse -c phpstan.neon src -l 3

    - name: PSALM
      run: |
        vendor/bin/psalm
